    <text x="28" y="118" class="stamp" font-size="17" fill="#f2eee6" opacity="0.82">YouTube Editing | Thumbnail Design | Scriptwriting</text>
    <text x="28" y="152" class="stamp" font-size="15" fill="#f2eee6" opacity="0.62">Retention-focused edits for creators, brands,</text>
    <text x="28" y="176" class="stamp" font-size="15" fill="#f2eee6" opacity="0.62">educators, podcasts, and digital storytellers.</text>
