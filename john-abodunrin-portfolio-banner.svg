    <rect x="0" y="0" width="430" height="210" fill="#101010" stroke="#f2eee6" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="9 8"/>
    <text x="28" y="42" class="stamp tiny" fill="#ff0000">YOUTUBE EDITOR | STORYTELLING SPECIALIST</text>
