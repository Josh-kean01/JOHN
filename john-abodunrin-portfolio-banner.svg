<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="John Abodunrin video editor portfolio banner">
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.18"/>
      </feComponentTransfer>
    </filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#ffffff" opacity="0.08"/>
    </pattern>
    <pattern id="news" width="180" height="120" patternUnits="userSpaceOnUse">
      <rect width="180" height="120" fill="#d8d0b8"/>
      <g fill="#151515" opacity="0.35" font-family="Georgia, serif" font-size="8">
        <text x="8" y="16">creator economy retention storytelling</text>
        <text x="8" y="30">youtube editing watch time growth</text>
        <text x="8" y="44">thumbnail hooks pacing scripts</text>
        <text x="8" y="58">audience psychology video structure</text>
        <text x="8" y="72">attention is earned frame by frame</text>
        <text x="8" y="86">cut rhythm sound design motion</text>
        <text x="8" y="100">views generated creator partner</text>
      </g>
    </pattern>
    <style>
      .display { font-family: Impact, "Arial Black", sans-serif; letter-spacing: 3px; }
      .stamp { font-family: "Courier New", monospace; }
      .small { font-size: 18px; }
      .tiny { font-size: 13px; letter-spacing: 2px; }
    </style>
  </defs>

  <!-- background -->
  <rect width="1280" height="720" fill="#080808"/>
  <rect width="1280" height="720" fill="url(#dots)"/>
  <rect width="1280" height="720" filter="url(#grain)" opacity="0.8"/>

