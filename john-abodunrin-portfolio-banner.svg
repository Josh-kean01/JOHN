    <polygon points="0,10 18,0 400,0 422,12 410,98 14,96 0,84" fill="#f2eee6"/>
    <text x="42" y="68" class="display" font-size="64" fill="#0a0a0a">PORTFOLIO</text>
  </g>

  <!-- byline -->
  <text x="113" y="86" class="stamp small" fill="#f2eee6">By John Abodunrin - 2019 to 2026</text>

